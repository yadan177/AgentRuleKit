<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计审查测试：申请体验</title><style>body{font:16px system-ui;background:#f2f4f8;color:#243043;margin:0}main{max-width:470px;margin:70px auto;padding:36px;background:white;border-radius:16px}h1{font-size:28px;margin:16px 0}p{line-height:1.6;color:#667185}.tag{color:#4768aa;font-size:13px}input:not([type=checkbox]){width:100%;box-sizing:border-box;padding:14px;border:1px solid #dde2e9;margin:10px 0;border-radius:8px}button{padding:8px 15px;border:0;color:#c1c6ce;background:#f4f5f6;border-radius:5px;font-size:12px;margin-top:22px;cursor:pointer}.agree{font-size:12px;color:#adb3bd;margin-top:12px}#result{display:none}.success{color:#16864d}</style><main><span class="tag">体验申请 · 演示数据</span><section id="form"><h1>申请使用团队工作台</h1><p>填写信息，获得产品体验资格。</p><form onsubmit="event.preventDefault();document.querySelector('#form').style.display='none';document.querySelector('#result').style.display='block'"><input placeholder="姓名"><input placeholder="手机号"><input placeholder="公司"><div class="agree"><input id="agreement" type="checkbox" checked> 同意隐私政策与相关服务条款</div><button>下一步</button></form><p style="font-size:12px">本页面为迁移验收夹具，不收集信息，不连接外部服务。</p></section><section id="result"><h1 class="success">提交成功</h1><p>我们会联系您。</p></section></main></html>
