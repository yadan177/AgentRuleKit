name: 发布桌面应用

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 确认发布标签来自 main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 核对桌面标签和源码版本
        run: node -e 'const p=require("./packages/desktop-app/package.json"); if (process.env.GITHUB_REF_NAME !== `desktop-v${p.version}`) process.exit(1)'
      - run: npm run check
      - run: npm run typecheck --workspace agentrulekit-desktop

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:mac --workspace agentrulekit-desktop
      - name: 核对手动安装包
        run: node packages/desktop-app/scripts/verify-update-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: manual-macos
          path: |
            packages/desktop-app/release/*.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:win --workspace agentrulekit-desktop
      - name: 核对手动安装包
        run: node packages/desktop-app/scripts/verify-update-assets.mjs --manual
      - uses: actions/upload-artifact@v4
        with:
          name: manual-windows
          path: |
            packages/desktop-app/release/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 发布独立的桌面应用 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="packages/desktop-app/RELEASE-${version}.md"
          test -f "$notes"
          test -f "release-assets/AgentRuleKit-Desktop-${version}-macOS-arm64.dmg"
          test -f "release-assets/AgentRuleKit-Desktop-${version}-Windows-x64.exe"
          test ! -f release-assets/latest.yml
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "AI 开发工具箱 $version" --notes-file "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
