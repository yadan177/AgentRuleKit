name: 发布 npm CLI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: 检查版本并构建
        shell: bash
        run: |
          npm install -g npm@latest
          npm ci
          npm run check
          node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
      - name: 发布 agentrulekit
        run: npm publish --workspace agentrulekit --access public
