name: 桌面应用安装包

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'packages/desktop-app/**'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: pack:mac
            artifact: desktop-macos-arm64
            files: |
              packages/desktop-app/release/*.dmg
          - os: windows-latest
            script: pack:win
            artifact: desktop-windows-x64
            files: |
              packages/desktop-app/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck --workspace agentrulekit-desktop
      - run: npm run ${{ matrix.script }} --workspace agentrulekit-desktop
      - name: 核对手动安装包
        run: node packages/desktop-app/scripts/verify-update-assets.mjs --manual
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
