name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run --workspace agentrulekit
      # npm run check 已包含插件静态结构、Hook 语法与行为测试。

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: 核对版本并打包权威规则源
        shell: bash
        run: |
          node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
          node scripts/create-release-manifest.mjs "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"
          tar -czf agentrulekit-rulepacks.tar.gz agentrulekit-release.json rulepacks
      - name: 发布规则包 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agentrulekit-rulepacks.tar.gz --verify-tag --generate-notes
